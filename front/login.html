<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="./login.js" defer></script>

    <title>Entrar</title>
</head>

<body>

    <main class="container">

        <section class="box">

            <div class="header">
                <div class="icone">→</div>

                <h1>Entrar</h1>

                <p>Informe seu e-mail e senha para acessar o sistema.</p>
            </div>

            <form>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                           placeholder="Digite seu e-mail" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                           placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>

                <button type="submit">Entrar</button>

            </form>

            <p class="rodape">
                Ainda não tem conta? <a href="index.html">Criar conta</a>
            </p>

        </section>

    </main>

</body>

</html>
