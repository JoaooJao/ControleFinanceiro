<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>

    <title>Cadastro de Usuário</title>
</head>

<body>

    <main class="container">

        <section class="box">

            <div class="header">
                <div class="icone">+</div>

                <h1>Criar conta</h1>

                <p>
                    Preencha seus dados para realizar o cadastro.
                </p>
            </div>

            <form>

                <div class="campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="new-password"
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                        autocomplete="tel"
                    >
                </div>

                <button type="submit">
                    Criar minha conta
                </button>

            </form>

            <p class="rodape">
                Possui uma conta? <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>

</body>

</html>
